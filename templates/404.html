{% extends "base.html" %}

{% block title %}404 – Page Not Found – SkillMarket{% endblock %}

{% block content %}
<div class="container text-center" style="padding: 6rem 0;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--primary); line-height: 1; margin-bottom: 1rem;">404</div>
  <h1 style="font-size: 2rem; margin-bottom: 0.75rem;">Page Not Found</h1>
  <p style="color: var(--text-muted); max-width: 460px; margin: 0 auto 2rem;">
    The skill, roadmap, or resource you were looking for doesn't exist or has moved.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">
    <i data-lucide="home" style="width: 16px; height: 16px;"></i> Return Home
  </a>
</div>
{% endblock %}
