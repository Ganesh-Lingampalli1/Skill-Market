{% extends "base.html" %}

{% block title %}Admin Login – SkillMarket{% endblock %}

{% block content %}
<section style="padding: 5rem 0; display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 150px);">
  <div class="container container-narrow" style="max-width: 440px;">
    <div class="card" style="padding: 2.5rem; box-shadow: var(--shadow-lg);">
      <div class="text-center" style="margin-bottom: 2rem;">
        <div class="stat-icon-wrapper" style="margin: 0 auto 1rem; background-color: var(--primary-light); color: var(--primary);">
          <i data-lucide="shield"></i>
        </div>
        <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Admin Gateway</h1>
        <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0;">Restricted administrator authentication</p>
      </div>

      <form action="{{ url_for('admin.login') }}" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Admin Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="admin" value="{{ username or 'admin' }}" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Admin Email</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="admin@skillmarket.com" value="{{ email or 'admin@skillmarket.com' }}" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
          Enter Admin Console <i data-lucide="shield-check" style="width: 18px; height: 18px;"></i>
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="{{ url_for('index') }}" class="btn btn-ghost btn-sm">Return to SkillMarket</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
